services:
  backend:
    ports:
      - "127.0.0.1:${HOST_MANAGEMENT_PORT:-8081}:8081"

  loki:
    ports:
      - "127.0.0.1:${HOST_LOKI_PORT:-3100}:3100"

  tempo:
    ports:
      - "127.0.0.1:${HOST_TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${HOST_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${HOST_OTEL_HTTP_PORT:-4318}:4318"

  prometheus:
    ports:
      - "127.0.0.1:${HOST_PROMETHEUS_PORT:-9090}:9090"

  alertmanager:
    ports:
      - "127.0.0.1:${HOST_ALERTMANAGER_PORT:-9093}:9093"

  alloy:
    ports:
      - "127.0.0.1:${HOST_ALLOY_PORT:-12345}:12345"
