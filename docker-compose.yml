services:
  # ==================== 基础设施 ====================

  postgres:
    image: postgres:18.4-alpine
    container_name: bcd-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}"]
    env_file:
      - ./config/env-files/database.env
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  redis:
    image: redis:8.8.1-alpine
    container_name: bcd-redis
    restart: unless-stopped
    env_file:
      - ./config/env-files/database.env
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    container_name: bcd-seaweedfs
    restart: unless-stopped
    env_file:
      - ./config/env-files/storage.env
    command: "server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -filer -webdav"
    ports:
      - "${HOST_SEAWEEDFS_S3_PORT:-8333}:8333"         # S3 API
      - "${HOST_SEAWEEDFS_WEBDAV_PORT:-8888}:8888"     # WebDAV
      - "${HOST_SEAWEEDFS_MASTER_PORT:-9333}:9333"     # Master
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://$$(hostname -i):9333/cluster/status"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - bcd-network

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: bcd-mailpit
    restart: unless-stopped
    env_file:
      - ./config/env-files/mail.env
    ports:
      - "${HOST_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${HOST_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bcd-network

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    container_name: bcd-rabbitmq
    restart: unless-stopped
    env_file:
      - ./config/env-files/rabbitmq.env
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    ports:
      - "${HOST_RABBITMQ_PORT:-5672}:5672"
      - "${HOST_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bcd-network

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:9.3.0.1
    container_name: bcd-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-betterclouddrive-onlyoffice-dev-secret}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    ports:
      - "${HOST_ONLYOFFICE_PORT:-8082}:80"
    volumes:
      - onlyofficedata:/var/www/onlyoffice/Data
      - onlyofficelogs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - bcd-network

  loki:
    image: grafana/loki:3.6.13
    container_name: bcd-loki
    restart: unless-stopped
    env_file:
      - ./config/env-files/observability.env
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-30d}
    command: -config.file=/etc/loki/config.yml -config.expand-env=true
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    healthcheck:
      # Loki 3.x is distroless and no longer contains a shell or wget.
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  tempo:
    image: grafana/tempo:2.9.4
    container_name: bcd-tempo
    restart: unless-stopped
    env_file:
      - ./config/env-files/observability.env
    environment:
      TEMPO_RETENTION_PERIOD: ${TEMPO_RETENTION_PERIOD:-168h}
    command: ["-config.file=/etc/tempo/config.yml", "-config.expand-env=true"]
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempodata:/var/tempo
    healthcheck:
      # Tempo 2.9 is distroless and no longer contains a shell or wget.
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: bcd-otel-collector
    restart: unless-stopped
    env_file:
      - ./config/env-files/observability.env
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel/config.yml:ro
    depends_on:
      - tempo
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel/config.yml"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bcd-network

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: bcd-alloy
    restart: unless-stopped
    env_file:
      - ./config/env-files/observability.env
    environment:
      ALLOY_LOKI_PUSH_URL: ${ALLOY_LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - backendlogs:/var/log/cloud-drive:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      # The Alloy image has no HTTP client; Prometheus separately scrapes :12345.
      test: ["CMD-SHELL", "pidof alloy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: bcd-prometheus
    restart: unless-stopped
    env_file:
      - ./config/env-files/observability.env
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules/better-cloud-drive.yml:ro
      - ./observability/prometheus-rules.test.yml:/etc/prometheus/tests/better-cloud-drive.test.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: bcd-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./observability/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: bcd-postgres-exporter
    restart: unless-stopped
    env_file:
      - ./config/env-files/database.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bcd-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine
    container_name: bcd-redis-exporter
    restart: unless-stopped
    env_file:
      - ./config/env-files/database.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bcd-network

  backend-log-init:
    image: betterclouddrive-backend
    container_name: bcd-backend-log-init
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /var/log/cloud-drive && chown -R appuser:appgroup /var/log/cloud-drive
    volumes:
      - backendlogs:/var/log/cloud-drive
    restart: "no"
    networks:
      - bcd-network

  grafana:
    image: grafana/grafana:13.1.1
    container_name: bcd-grafana
    restart: unless-stopped
    env_file:
      - ./config/env-files/observability.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Name:X-WEBAUTH-NAME Email:X-WEBAUTH-EMAIL Role:X-WEBAUTH-ROLE"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bcd-network

  # ==================== 应用服务 ====================

  backend:
    image: betterclouddrive-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bcd-backend
    restart: unless-stopped
    depends_on:
      backend-log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      onlyoffice-documentserver:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - ./config/env-files/database.env
      - ./config/env-files/rabbitmq.env
      - ./config/env-files/storage.env
      - ./config/env-files/security.env
      - ./config/env-files/backend.env
      - ./config/env-files/observability.env
      - ./config/env-files/mail.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      MAIL_FROM: ${MAIL_FROM:-noreply@betterclouddrive.local}
      GRAFANA_AUTH_COOKIE_SECURE: ${GRAFANA_AUTH_COOKIE_SECURE:-false}
    ports:
      - "${HOST_BACKEND_PORT:-8080}:8080"
    volumes:
      - backendlogs:/var/log/cloud-drive
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bcd-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-}
        VITE_DESKTOP_API_BASE_URL: ${VITE_DESKTOP_API_BASE_URL:-http://127.0.0.1:8080/api/v1}
        VITE_DESKTOP_WEB_BASE_URL: ${VITE_DESKTOP_WEB_BASE_URL:-http://127.0.0.1:3000}
    container_name: bcd-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
    env_file:
      - ./config/env-files/frontend.env
    environment:
      NGINX_ENVSUBST_FILTER: ^FRONTEND_BACKEND_PROXY_BASE$
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bcd-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  rabbitmqdata:
    driver: local
  seaweeddata:
    driver: local
  backendlogs:
    driver: local
  lokidata:
    driver: local
  tempodata:
    driver: local
  grafanadata:
    driver: local
  prometheusdata:
    driver: local
  alertmanagerdata:
    driver: local
  alloydata:
    driver: local
  onlyofficedata:
    driver: local
  onlyofficelogs:
    driver: local

networks:
  bcd-network:
    driver: bridge
