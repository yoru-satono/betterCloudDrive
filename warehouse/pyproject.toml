[project]
name = "betterclouddrive-warehouse"
version = "0.1.0"
description = "Credential-free business event ingestion and batch analytics"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect==1.13.0",
  "psycopg[binary]==3.3.9",
  "dbt-core==1.12.7",
  "dbt-clickhouse==1.10.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bcd_warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL and ClickHouse containers"]
