receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB}
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp_grpc/tempo:
    endpoint: ${env:OTEL_COLLECTOR_TEMPO_ENDPOINT}
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: ${env:OTEL_COLLECTOR_QUEUE_CONSUMERS}
      queue_size: ${env:OTEL_COLLECTOR_QUEUE_SIZE}
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
