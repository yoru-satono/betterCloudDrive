global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@betterclouddrive.local
  smtp_require_tls: false

route:
  receiver: development-email
  group_by: [alertname, severity]
  group_wait: 5s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: development-email
    email_configs:
      - to: admin@betterclouddrive.local
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname]
