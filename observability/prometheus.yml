global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker-compose

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: better-cloud-drive
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: promtail
    static_configs:
      - targets: [promtail:9080]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
