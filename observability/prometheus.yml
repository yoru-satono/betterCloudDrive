global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker-compose

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: better-cloud-drive
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8081]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://frontend/healthz]
        labels:
          service: frontend
      - targets: [http://backend:8081/actuator/health]
        labels:
          service: backend
      - targets: [http://onlyoffice-documentserver/healthcheck]
        labels:
          service: onlyoffice
      - targets: [http://seaweedfs:9333/cluster/status]
        labels:
          service: seaweedfs-master
      - targets: [http://seaweedfs:8888/]
        labels:
          service: seaweedfs-filer
      - targets: [http://seaweedfs:8333/]
        labels:
          service: seaweedfs-s3
      - targets: [http://grafana:3000/api/health]
        labels:
          service: grafana
      - targets: [http://loki:3100/ready]
        labels:
          service: loki
      - targets: [http://tempo:3200/ready]
        labels:
          service: tempo
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
