groups:
  - name: better-cloud-drive-sli
    interval: 30s
    rules:
      - record: bcd:sli:http_availability:ratio_5m
        expr: |
          1 - (
            (sum(rate(http_server_requests_seconds_count{job="better-cloud-drive",status=~"5.."}[5m])) or vector(0))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{job="better-cloud-drive"}[5m])), 0.001)
          )

      - record: bcd:sli:http_latency_p95:seconds_5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="better-cloud-drive"}[5m]))
          )

      - record: bcd:sli:queue_processing_success:ratio_15m
        expr: |
          1 - (
            sum(rate(bcd_queue_processing_results_total{outcome="failure"}[15m]))
            /
            clamp_min(sum(rate(bcd_queue_processing_results_total[15m])), 0.001)
          )

      - record: bcd:sli:onlyoffice_save_success:ratio_1h
        expr: |
          1 - (
            sum(increase(bcd_onlyoffice_save_results_total{outcome="failure"}[1h]))
            /
            clamp_min(sum(increase(bcd_onlyoffice_save_results_total[1h])), 1)
          )

  - name: better-cloud-drive-availability
    rules:
      - alert: BetterCloudDriveBackendDown
        expr: up{job="better-cloud-drive"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BetterCloudDrive backend is unavailable
          description: Prometheus has failed to scrape the backend for more than 2 minutes.

      - alert: BetterCloudDriveHighServerErrorRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="better-cloud-drive",status=~"5.."}[5m])) or vector(0))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="better-cloud-drive"}[5m])), 0.001)
          > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend 5xx error rate is above 2%
          description: More than 2% of backend requests have returned 5xx responses for 5 minutes.

      - alert: BetterCloudDriveHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="better-cloud-drive"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend p95 latency is above 2 seconds
          description: The backend p95 HTTP latency has exceeded 2 seconds for 10 minutes.

      - alert: BetterCloudDriveJvmHeapPressure
        expr: |
          sum(jvm_memory_used_bytes{job="better-cloud-drive",area="heap"})
          /
          clamp_min(sum(jvm_memory_max_bytes{job="better-cloud-drive",area="heap"}), 1)
          > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Backend JVM heap pressure is high
          description: JVM heap usage has remained above 85% for 15 minutes.

  - name: better-cloud-drive-business
    rules:
      - alert: BetterCloudDriveQueueBacklog
        expr: bcd_queue_messages_ready > 100 or bcd_queue_records_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: BetterCloudDrive queue backlog is growing
          description: A RabbitMQ queue or durable database queue has exceeded 100 pending records for 10 minutes.

      - alert: BetterCloudDriveDeadLettersPresent
        expr: bcd_queue_messages_ready{queue="dead-letter"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BetterCloudDrive dead-letter queue is not empty
          description: Messages have remained in the dead-letter queue for more than 2 minutes.

      - alert: BetterCloudDriveQueueObservationUnavailable
        expr: bcd_queue_observation_available == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Queue metrics source is unavailable
          description: BetterCloudDrive cannot observe RabbitMQ or the durable queue tables.

      - alert: BetterCloudDriveOnlyOfficeSaveFailures
        expr: increase(bcd_onlyoffice_save_results_total{outcome="failure"}[10m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OnlyOffice saves are repeatedly failing
          description: More than two OnlyOffice save failures occurred within ten minutes.

  - name: better-cloud-drive-observability
    rules:
      - alert: BetterCloudDriveObservationDataStale
        expr: |
          (time() - bcd_observation_last_success_timestamp_seconds > 300)
          or
          (
            bcd_observation_last_success_timestamp_seconds == 0
            and on() (max(time() - process_start_time_seconds) > 300)
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: BetterCloudDrive observation data is stale
          description: The {{ $labels.source }} observation source has not refreshed successfully for more than five minutes.

      - alert: BetterCloudDriveObservabilityTargetDown
        expr: up{job=~"loki|tempo|otel-collector|alloy|prometheus|alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An observability component is unavailable
          description: Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}.

      - alert: BetterCloudDriveInfrastructureExporterDown
        expr: up{job=~"postgres|redis|rabbitmq"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An infrastructure metrics target is unavailable
          description: Prometheus cannot scrape {{ $labels.job }} metrics at {{ $labels.instance }}.

      - alert: BetterCloudDriveDatabasePoolSaturation
        expr: hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend database pool is close to saturation
          description: More than 85% of the backend database connections have been active for 10 minutes.

      - alert: BetterCloudDriveRedisMemoryPressure
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Redis memory usage is above 85%
          description: Redis is approaching its configured memory limit.

      - alert: BetterCloudDriveRedisEvictions
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis is evicting keys
          description: Redis evicted one or more keys in the last 15 minutes.

      - alert: BetterCloudDrivePostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL deadlocks detected
          description: PostgreSQL reported one or more deadlocks in the last 15 minutes.

      - alert: BetterCloudDriveRabbitMqResourceAlarm
        expr: rabbitmq_alarms_free_disk_space_watermark > 0 or rabbitmq_alarms_memory_used_watermark > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RabbitMQ resource alarm is active
          description: RabbitMQ has raised a disk or memory watermark alarm.

      - alert: BetterCloudDrivePrometheusStorageFailure
        expr: increase(prometheus_tsdb_wal_writes_failed_total[10m]) > 0 or increase(prometheus_tsdb_compactions_failed_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus storage operation failed
          description: Prometheus reported a WAL write or TSDB compaction failure.

      - alert: BetterCloudDriveLokiIngestionFailure
        expr: increase(loki_write_dropped_entries_total[10m]) > 0 or increase(loki_ingester_wal_disk_full_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Loki dropped log entries
          description: Loki dropped entries or could not write its WAL because storage was full.

      - alert: BetterCloudDriveTempoFlushFailure
        expr: increase(tempo_ingester_failed_flushes_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Tempo trace flush failed
          description: Tempo failed to flush trace blocks during the last 10 minutes.

  - name: better-cloud-drive-slo
    rules:
      - alert: BetterCloudDriveAvailabilityFastBurn
        expr: bcd:sli:http_availability:ratio_5m < 0.95
        for: 5m
        labels:
          severity: critical
          slo: http-availability
          window: fast
        annotations:
          summary: HTTP availability is rapidly consuming the error budget
          description: Five-minute HTTP availability has remained below 95% for 5 minutes.

      - alert: BetterCloudDriveAvailabilitySLOBreach
        expr: bcd:sli:http_availability:ratio_5m < 0.99
        for: 15m
        labels:
          severity: critical
          slo: http-availability
        annotations:
          summary: HTTP availability is below the 99% objective
          description: The rolling HTTP availability SLI has remained below 99% for 15 minutes.

      - alert: BetterCloudDriveQueueSuccessFastBurn
        expr: bcd:sli:queue_processing_success:ratio_15m < 0.90
        for: 5m
        labels:
          severity: critical
          slo: queue-processing
          window: fast
        annotations:
          summary: Queue processing failures are rapidly consuming the error budget
          description: Queue processing success has remained below 90% for 5 minutes.

      - alert: BetterCloudDriveQueueSuccessSLOBreach
        expr: bcd:sli:queue_processing_success:ratio_15m < 0.99
        for: 15m
        labels:
          severity: warning
          slo: queue-processing
        annotations:
          summary: Queue processing success is below the 99% objective
          description: Background queue processing success has remained below 99% for 15 minutes.
