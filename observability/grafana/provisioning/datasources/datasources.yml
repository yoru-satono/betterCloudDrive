apiVersion: 1

deleteDatasources:
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    uid: bcd-prometheus
    type: prometheus
    access: proxy
    url: ${GRAFANA_DS_PROMETHEUS_URL}
    isDefault: true
    editable: false

  - name: Loki
    uid: bcd-loki
    type: loki
    access: proxy
    url: ${GRAFANA_DS_LOKI_URL}
    isDefault: false
    editable: false

  - name: Alertmanager
    uid: bcd-alertmanager
    type: alertmanager
    access: proxy
    url: ${GRAFANA_DS_ALERTMANAGER_URL}
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
