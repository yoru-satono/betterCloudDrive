rule_files:
  - /etc/prometheus/rules/better-cloud-drive.yml

evaluation_interval: 1m

tests:
  - name: storage inspection coverage and confirmed findings
    interval: 1m
    input_series:
      - series: bcd_storage_inspection_enabled
        values: '1x20'
      - series: bcd_storage_quota_accounting_ready
        values: '1x20'
      - series: bcd_storage_inspection_last_complete_timestamp
        values: '-200000x20'
      - series: bcd_storage_inspection_actionable_findings
        values: '2x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: BetterCloudDriveStorageInspectionDelayed
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Storage inspection coverage is stale
              description: No complete storage inspection has been recorded within 48 hours.
      - eval_time: 6m
        alertname: BetterCloudDriveStorageInspectionFindings
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Confirmed storage discrepancies require review
              description: Confirmed content or metadata errors remain open and have not been ignored by an administrator.

  - name: partial inspection and incomplete cutover
    interval: 1m
    input_series:
      - series: 'bcd_storage_inspection_runs_total{kind="FULL",status="PARTIAL"}'
        values: '0+1x20'
      - series: bcd_storage_quota_accounting_ready
        values: '0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: BetterCloudDriveStorageInspectionFailed
        exp_alerts:
          - exp_labels: { severity: warning, kind: FULL }
            exp_annotations:
              summary: A full storage inspection did not complete
              description: A recent inspection failed or produced partial coverage; the previous complete report remains available.
      - eval_time: 16m
        alertname: BetterCloudDriveQuotaAccountingNotReady
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Capacity accounting cutover is incomplete
              description: Capacity-changing operations remain gated; complete or recover the explicit offline accounting cutover.

  - name: disabled scheduled inspection does not produce a stale alert
    interval: 1m
    input_series:
      - series: bcd_storage_inspection_enabled
        values: '0x20'
      - series: bcd_storage_quota_accounting_ready
        values: '1x20'
      - series: bcd_storage_inspection_last_complete_timestamp
        values: '-200000x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: BetterCloudDriveStorageInspectionDelayed
        exp_alerts: []
  - name: disabled warehouse does not alert
    interval: 1m
    input_series:
      - series: 'bcd_warehouse_query_enabled'
        values: '0x15'
      - series: 'bcd_warehouse_query_available'
        values: '0x15'
      - series: 'bcd_warehouse_publication_age_seconds'
        values: '10000x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: BetterCloudDriveWarehouseUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: BetterCloudDriveWarehouseDelayed
        exp_alerts: []

  - name: enabled warehouse reports unavailable and delayed states
    interval: 1m
    input_series:
      - series: 'bcd_warehouse_query_enabled'
        values: '1x15'
      - series: 'bcd_warehouse_query_available'
        values: '0x15'
      - series: 'bcd_warehouse_publication_age_seconds'
        values: '10000x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: BetterCloudDriveWarehouseUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Business warehouse queries are unavailable
              description: The enabled warehouse has failed its read-only query probe for five minutes.
      - eval_time: 11m
        alertname: BetterCloudDriveWarehouseDelayed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Business warehouse processing is delayed
              description: A publication or unexported source event is more than two hours old.

  - name: low traffic does not trigger ratio or latency alerts
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="better-cloud-drive",status="500"}'
        values: '0+1x10'
      - series: 'http_server_requests_seconds_bucket{job="better-cloud-drive",status="500",le="2.0"}'
        values: '0+0x10'
      - series: 'http_server_requests_seconds_bucket{job="better-cloud-drive",status="500",le="+Inf"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: BetterCloudDriveHighServerErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: BetterCloudDriveHighP95Latency
        exp_alerts: []

  - name: sustained backend and storage failures trigger core alerts
    interval: 1m
    input_series:
      - series: 'up{job="better-cloud-drive",instance="backend:8081"}'
        values: '0x10'
      - series: 'bcd_storage_operations_total{operation="put",outcome="failure"}'
        values: '0+2x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BetterCloudDriveBackendDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: better-cloud-drive
              instance: backend:8081
            exp_annotations:
              summary: BetterCloudDrive backend is unavailable
              description: Prometheus has failed to scrape the backend for more than 2 minutes.
      - eval_time: 10m
        alertname: BetterCloudDriveStorageFailures
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Object storage operations are repeatedly failing
              description: More than five S3-compatible storage operations failed within ten minutes.

  - name: dead letters trigger administrator alert
    interval: 1m
    input_series:
      - series: 'bcd_queue_dead_letters{queue="team-tasks",category="delivery-exhausted"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: BetterCloudDriveDeadLettersPresent
        exp_alerts:
          - exp_labels:
              severity: critical
              service: dead-letter-management
              queue: team-tasks
              category: delivery-exhausted
            exp_annotations:
              summary: BetterCloudDrive has unresolved dead letters
              description: Open dead letters from team-tasks with category delivery-exhausted require administrator action.
              runbook_url: https://github.com/yoru-satono/betterCloudDrive/blob/main/docs/operations/OBSERVABILITY.md#死信处置
              dashboard_url: /admin/dead-letters
