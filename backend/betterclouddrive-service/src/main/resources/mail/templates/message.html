<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${subject}">BetterCloudDrive</title>
</head>
<body style="margin:0;padding:0;background:#f7f8fa;color:#18212d;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
<div th:text="${preheader}" style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">Notification</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f8fa;">
  <tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;">
      <tr><td style="padding:0 4px 18px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr>
          <td style="width:34px;height:34px;text-align:center;border-radius:9px;background:#e6f3f0;color:#007a65;font-weight:800;font-size:15px;">B</td>
          <td style="padding-left:11px;font-size:17px;font-weight:700;letter-spacing:-0.2px;color:#18212d;">BetterCloudDrive</td>
        </tr></table>
      </td></tr>
      <tr><td style="background:#ffffff;border:1px solid #e4e7ec;border-radius:14px;padding:36px 34px;box-shadow:0 6px 20px rgba(15,23,42,0.08);">
        <h1 th:text="${heading}" style="margin:0 0 14px;font-size:24px;line-height:1.3;color:#18212d;">Heading</h1>
        <p th:text="${body}" style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#526071;white-space:pre-line;">Body</p>

        <div th:if="${code != null and !#strings.isEmpty(code)}" style="margin:22px 0;padding:20px;text-align:center;background:#eef7f5;border:1px solid #cce5df;border-radius:10px;">
          <div th:if="${!#strings.isEmpty(codeLabel)}" th:text="${codeLabel}" style="margin-bottom:7px;font-size:12px;color:#667085;">Code</div>
          <div th:text="${code}" style="font-family:'SFMono-Regular',Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#007a65;">000000</div>
        </div>

        <table th:if="${details != null and !details.isEmpty()}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:20px 0;background:#f7f8fa;border-radius:9px;">
          <tr th:if="${!#strings.isEmpty(detailsLabel)}"><td colspan="2" th:text="${detailsLabel}" style="padding:14px 16px 7px;font-size:12px;font-weight:700;color:#526071;">Details</td></tr>
          <tr th:each="detail : ${details}">
            <td th:text="${detail.key}" style="padding:8px 16px;font-size:13px;color:#667085;border-top:1px solid #e4e7ec;">Label</td>
            <td th:text="${detail.value}" align="right" style="padding:8px 16px;font-size:13px;font-weight:600;color:#18212d;border-top:1px solid #e4e7ec;word-break:break-word;">Value</td>
          </tr>
        </table>

        <table th:if="${link != null and !#strings.isEmpty(link) and !#strings.isEmpty(buttonLabel)}" role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:26px 0 8px;"><tr>
          <td bgcolor="#007a65" style="border-radius:8px;"><a th:href="${link}" th:text="${buttonLabel}" style="display:inline-block;padding:12px 20px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">Open</a></td>
        </tr></table>
        <div th:if="${link != null and !#strings.isEmpty(link)}" style="margin-top:20px;padding-top:18px;border-top:1px solid #e4e7ec;font-size:12px;line-height:1.6;color:#667085;">
          <span th:text="${fallback}">Fallback</span><br><a th:href="${link}" th:text="${link}" style="color:#007a65;word-break:break-all;">Link</a>
        </div>
      </td></tr>
      <tr><td th:text="${footer}" align="center" style="padding:20px 16px 0;font-size:12px;line-height:1.6;color:#667085;">Footer</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
