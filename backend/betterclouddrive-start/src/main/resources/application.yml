server:
  port: 8080

spring:
  application:
    name: better-cloud-drive

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # PostgreSQL DataSource
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:better_cloud_drive}
    username: ${DB_USER:bcd_user}
    password: ${DB_PASSWORD:bcd_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis (Lettuce)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:bcd_user}
    password: ${RABBITMQ_PASSWORD:bcd_pass_2026}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true

  # Mailpit (email simulation)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public

  # Dispatch OPTIONS/custom methods to controllers (needed for WebDAV)
  mvc:
    dispatch-options-request: true

  # Multipart upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  sql:
    init:
      mode: never

  # Spring Data JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

# Storage (SeaweedFS S3)
storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:8333}
    access-key: ${STORAGE_S3_ACCESS_KEY:any}
    secret-key: ${STORAGE_S3_SECRET_KEY:any}
    bucket: cloud-drive
    region: us-east-1
    path-style-access: true

# JWT
jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:}
    expiration-ms: 1800000     # 30 minutes
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:}
    expiration-ms: 2592000000  # 30 days

# Share password encryption
share:
  password-encryption-key: ${SHARE_PASSWORD_ENCRYPTION_KEY:}

# OnlyOffice Docs
onlyoffice:
  internal-url: ${ONLYOFFICE_INTERNAL_URL:http://onlyoffice-documentserver}
  public-url: ${ONLYOFFICE_PUBLIC_URL:http://localhost:8082}
  app-internal-api-base-url: ${APP_INTERNAL_API_BASE_URL:http://backend:8080/api/v1}
  jwt-secret: ${ONLYOFFICE_JWT_SECRET:betterclouddrive-onlyoffice-dev-secret}
  token-ttl-seconds: ${ONLYOFFICE_TOKEN_TTL_SECONDS:86400}
  callback-download-timeout-seconds: ${ONLYOFFICE_CALLBACK_DOWNLOAD_TIMEOUT_SECONDS:30}

# RabbitMQ queue
queue:
  enabled: ${QUEUE_ENABLED:true}
  rabbitmq:
    exchange: ${QUEUE_RABBITMQ_EXCHANGE:bcd.events}
    dead-letter-exchange: ${QUEUE_RABBITMQ_DEAD_LETTER_EXCHANGE:bcd.dead-letter}
    notifications-queue: ${QUEUE_RABBITMQ_NOTIFICATIONS_QUEUE:bcd.notifications}
    team-tasks-queue: ${QUEUE_RABBITMQ_TEAM_TASKS_QUEUE:bcd.team-tasks}
    dead-letter-queue: ${QUEUE_RABBITMQ_DEAD_LETTER_QUEUE:bcd.dead-letter}
    notifications-routing-key: ${QUEUE_RABBITMQ_NOTIFICATIONS_ROUTING_KEY:notification.dispatch}
    team-tasks-routing-key: ${QUEUE_RABBITMQ_TEAM_TASKS_ROUTING_KEY:team-task.wakeup}
    prefetch: ${QUEUE_RABBITMQ_PREFETCH:20}
    concurrency: ${QUEUE_RABBITMQ_CONCURRENCY:1}
    max-concurrency: ${QUEUE_RABBITMQ_MAX_CONCURRENCY:4}
    max-deliveries: ${QUEUE_RABBITMQ_MAX_DELIVERIES:5}
    outbox-publish-batch-size: ${QUEUE_RABBITMQ_OUTBOX_PUBLISH_BATCH_SIZE:50}
    outbox-publish-interval-ms: ${QUEUE_RABBITMQ_OUTBOX_PUBLISH_INTERVAL_MS:5000}
    backlog-warn-threshold: ${QUEUE_RABBITMQ_BACKLOG_WARN_THRESHOLD:100}
    dead-letter-warn-threshold: ${QUEUE_RABBITMQ_DEAD_LETTER_WARN_THRESHOLD:1}

# Application settings
drive:
  recycle-bin:
    retention-days: 30
    cleanup-cron: "0 0 3 * * ?"   # 3:00 AM daily
  upload:
    chunk-size: 5242880           # 5MB
    session-expire-hours: 24
  download:
    folder-zip:
      max-files: 1000
      max-size-bytes: 1073741824  # 1GB
  version:
    max-versions: 10
  share:
    visit-sync-interval-ms: 300000  # 5 minutes
  storage:
    default-quota-bytes: 10737418240  # 10GB default quota for new users
    quota-sync-interval-ms: 60000     # 1 minute
  tasks:
    result-directory: ${TEAM_TASK_RESULT_DIRECTORY:./data/team-task-results}
    result-retention-hours: ${TEAM_TASK_RESULT_RETENTION_HOURS:24}
    audit-export-batch-size: ${TEAM_AUDIT_EXPORT_BATCH_SIZE:10}
    audit-export-interval-ms: ${TEAM_AUDIT_EXPORT_INTERVAL_MS:60000}
    thumbnail-batch-size: ${THUMBNAIL_TASK_BATCH_SIZE:10}
    thumbnail-interval-ms: ${THUMBNAIL_TASK_INTERVAL_MS:60000}
    folder-zip-batch-size: ${FOLDER_ZIP_TASK_BATCH_SIZE:5}
    folder-zip-interval-ms: ${FOLDER_ZIP_TASK_INTERVAL_MS:60000}
    result-cleanup-interval-ms: ${TEAM_TASK_RESULT_CLEANUP_INTERVAL_MS:3600000}
    running-timeout-seconds: ${TEAM_TASK_RUNNING_TIMEOUT_SECONDS:1800}
  rate-limit:
    default-permits: 100
    default-period-seconds: 60
    upload-permits: 10
    upload-period-seconds: 60

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    metrics:
      export:
        enabled: ${METRICS_EXPORT_OTLP_ENABLED:false}
  tracing:
    export:
      enabled: ${TRACING_ENABLED:true}
      otlp:
        enabled: ${TRACING_EXPORT_OTLP_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

logging:
  file:
    path: ${LOG_DIR:./logs}
  structured:
    json:
      context:
        include: true
      add:
        service.name: ${spring.application.name}

observability:
  enabled: ${OBSERVABILITY_ENABLED:true}
  metrics:
    team-quota-refresh-interval-ms: ${TEAM_QUOTA_METRICS_REFRESH_INTERVAL_MS:60000}
    queue-refresh-interval-ms: ${QUEUE_METRICS_REFRESH_INTERVAL_MS:15000}
  legacy-operation-aspect:
    enabled: false
  system-logs:
    loki-base-url: ${LOKI_BASE_URL:http://localhost:3100}
    grafana-base-url: ${GRAFANA_BASE_URL:/grafana}
    grafana-datasource: ${GRAFANA_LOKI_DATASOURCE:Loki}
    default-limit: ${SYSTEM_LOG_DEFAULT_LIMIT:100}
    max-limit: ${SYSTEM_LOG_MAX_LIMIT:500}
  grafana-auth:
    secret: ${GRAFANA_AUTH_PROXY_SECRET:}
    ttl-seconds: ${GRAFANA_AUTH_PROXY_TTL_SECONDS:300}
  audit:
    enabled: ${AUDIT_LOG_ENABLED:true}
    full-event-enabled: ${AUDIT_FULL_EVENT_ENABLED:true}
    max-body-bytes: ${AUDIT_MAX_BODY_BYTES:8192}
