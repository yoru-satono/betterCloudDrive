services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  seaweedfs:
    ports: !reset []

  mailpit:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  onlyoffice-documentserver:
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET in the production environment}
    ports: !override
      - "127.0.0.1:${HOST_ONLYOFFICE_PORT:-8082}:80"

  backend:
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL to the public HTTPS drive URL}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?set ONLYOFFICE_PUBLIC_URL to the public HTTPS OnlyOffice URL}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET in the production environment}
      GRAFANA_AUTH_COOKIE_SECURE: "true"
    ports: !reset []

  frontend:
    ports: !override
      - "127.0.0.1:${HOST_FRONTEND_PORT:-3000}:80"
