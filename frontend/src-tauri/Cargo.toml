[package]
name = "betterclouddrive"
version = "0.1.0"
description = "BetterCloudDrive desktop client"
authors = ["BetterCloudDrive"]
edition = "2021"
rust-version = "1.88"

[package.metadata.bundle]
identifier = "com.betterclouddrive.desktop"
publisher = "BetterCloudDrive"
copyright = "Copyright (c) 2026 BetterCloudDrive"

[features]
e2e-webdriver = [
    "dep:tauri-plugin-wdio",
    "dep:tauri-plugin-wdio-webdriver",
]

[lib]
name = "betterclouddrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.4", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
reqwest = { version = "0.13.4", features = ["json", "multipart", "socks"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md5 = "0.8.1"
